<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codela OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F2EE;
    --surface: #FFFFFF;
    --surface-2: #F0F4F8;
    --line: #DEE3E8;
    --text: #1B1F23;
    --text-dim: #56687A;
    --text-faint: #8C98A4;
    --gold: #0A66C2;
    --gold-dim: #E1ECF9;
    --hot: #B23B26;
    --warm: #96650E;
    --cold: #5C7A80;
    --danger: #C0392B;
    --positive: #1E874B;
    --radius: 8px;
    --font-ar: 'Tajawal', sans-serif;
    --font-en: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html[lang="ar"] body{ font-family: var(--font-ar); }
  html[lang="en"] body{ font-family: var(--font-en); }
  body{
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }
  ::selection{ background: var(--gold-dim); color: var(--gold); }
  input, select, button, textarea{ font-family: inherit; font-size: inherit; color: inherit; }
  .mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  a{ color: var(--gold); text-decoration:none; }

  /* ---------- Ledger / KPI card ---------- */
  .ledger{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 1px 2px rgba(16,24,32,0.04);
  }
  .ledger-eyebrow{
    font-family: var(--font-en);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
  }
  .ledger-figure{
    font-family: var(--font-en);
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .ledger-sub{ margin-top: 12px; display:flex; flex-direction:column; gap:6px; }
  .ledger-row{ display:flex; justify-content:space-between; font-size: 13px; color: var(--text-dim); }
  .ledger-row b{ color: var(--text); font-weight:600; }

  /* ---------- Login ---------- */
  #loginScreen{
    min-height: 100vh; display:flex; align-items:center; justify-content:center;
    background: var(--bg);
    padding: 20px;
  }
  .login-box{ width: 380px; max-width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 32px; box-shadow: 0 1px 3px rgba(16,24,32,0.06), 0 8px 24px rgba(16,24,32,0.04); }
  .wordmark{
    font-family: var(--font-en);
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .login-title{ font-size: 24px; font-weight: 700; margin-bottom: 28px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight:500; }
  .field input, .field select, .field textarea{
    width: 100%; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 10px 12px; color: var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--gold); color: #fff; border: none; font-weight: 600;
    padding: 10px 18px; border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  .btn:hover{ filter: brightness(1.1); }
  .btn:active{ transform: translateY(1px); }
  .btn.secondary{ background: var(--surface); color: var(--text); border: 1px solid var(--line); font-weight:600; }
  .btn.secondary:hover{ border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
  .btn.danger{ background: var(--danger); color: #fff; }
  .btn:disabled{ opacity: 0.5; cursor: not-allowed; }
  .btn-sm{ padding: 6px 12px; font-size: 12.5px; }
  .error-msg{ background: #FBEAE8; border: 1px solid var(--danger); color: #8C2E22;
    padding: 8px 12px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; }
  .demo-hint{ margin-top: 22px; font-size: 12px; color: var(--text-faint); line-height:1.7; }
  .demo-hint b{ color: var(--text-dim); }

  /* ---------- Lang toggle ---------- */
  .lang-toggle{
    display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius: 20px;
    padding: 3px; width: fit-content; cursor: pointer; background: var(--surface-2);
  }
  .lang-toggle span{
    font-family: var(--font-en); font-size: 11px; padding: 4px 12px; border-radius: 16px;
    color: var(--text-faint); letter-spacing: 0.05em; font-weight:600;
  }
  .lang-toggle span.active{ background: var(--gold); color: #fff; font-weight:700; }

  /* ---------- App shell ---------- */
  #appShell{ display:none; min-height: 100vh; }
  #appShell.visible{ display:flex; }
  html[lang="en"] #appShell.visible{ direction: ltr; }

  .sidebar{
    width: 232px; flex-shrink:0; background: var(--surface); border-inline-end: 1px solid var(--line);
    display:flex; flex-direction:column; padding: 20px 0;
  }
  .sidebar-logo{ padding: 0 20px 20px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .sidebar-logo .wordmark{ margin-bottom: 2px; }
  .sidebar-logo .subline{ font-size: 11px; color: var(--text-faint); }
  .nav-item{
    display:flex; align-items:center; gap: 10px; padding: 10px 20px; color: var(--text-dim);
    cursor: pointer; font-size: 14px; border-inline-start: 3px solid transparent; font-weight:500;
  }
  .nav-item:hover{ color: var(--text); background: var(--surface-2); }
  .nav-item.active{ color: var(--gold); border-inline-start-color: var(--gold); background: var(--gold-dim); font-weight:600; }
  .nav-icon{ width: 16px; text-align:center; opacity:0.85; font-size:13px; }
  .sidebar-footer{ margin-top: auto; padding: 14px 20px 0; border-top: 1px solid var(--line); }
  .user-chip{ display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .user-avatar{
    width: 32px; height:32px; border-radius:50%; background: var(--gold); color: #fff;
    display:flex; align-items:center; justify-content:center; font-family: var(--font-en); font-size:13px; font-weight:700;
  }
  .user-name{ font-size: 13px; font-weight:600; }
  .user-role{ font-size: 11px; color: var(--text-faint); text-transform:uppercase; letter-spacing:0.04em; }

  .main{ flex:1; min-width: 0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding: 16px 28px;
    border-bottom: 1px solid var(--line); background: var(--surface);
  }
  .page-title{ font-size: 19px; font-weight:700; }
  .topbar-right{ display:flex; align-items:center; gap: 16px; }
  .ai-pill{
    display:flex; align-items:center; gap:6px; font-family: var(--font-en); font-size: 11px; font-weight:600;
    color: var(--text-dim); border: 1px solid var(--line); padding: 5px 10px; border-radius: 16px; background: var(--surface-2);
  }
  .ai-dot{ width:6px; height:6px; border-radius:50%; background: var(--text-faint); }
  .ai-dot.on{ background: var(--positive); box-shadow: 0 0 0 3px rgba(30,135,75,0.15); }

  .content{ padding: 24px 28px; overflow-y:auto; flex:1; }
  .grid{ display:grid; gap: 16px; }
  .grid-4{ grid-template-columns: repeat(4, 1fr); }
  .grid-2{ grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1000px){ .grid-4{ grid-template-columns: repeat(2,1fr);} }
  @media (max-width: 700px){ .grid-4, .grid-2{ grid-template-columns: 1fr; } #appShell.visible{flex-direction:column;} .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:10px;} .sidebar-footer{display:none;} .sidebar-logo{display:none;} }

  .section-title{ font-size: 14px; font-weight:700; margin: 26px 0 12px; color: var(--text); }
  .section-title:first-child{ margin-top:0; }

  table{ width:100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow:hidden; }
  th{
    text-align: start; font-family: var(--font-en); font-size: 11px; text-transform:uppercase;
    letter-spacing:0.06em; color: var(--text-faint); padding: 10px 12px; border-bottom: 1px solid var(--line);
    font-weight:600; background: var(--surface-2);
  }
  td{ padding: 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
  tr:last-child td{ border-bottom:none; }
  tr.clickable:hover{ background: var(--surface-2); cursor:pointer; }

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding: 3px 9px; border-radius: 12px;
    font-size: 11.5px; font-weight:700;
  }
  .badge.hot{ background: #FBEAE6; color: var(--hot); }
  .badge.warm{ background: #FBF1DE; color: var(--warm); }
  .badge.cold{ background: #E9EFF0; color: var(--cold); }
  .badge.status{ background: var(--surface-2); color: var(--text-dim); border:1px solid var(--line); }
  .badge.won{ background: #E4F5EB; color: var(--positive); }
  .badge.lost{ background: #FBEAE8; color: var(--danger); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap:wrap; margin-bottom: 14px;}
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .filters select{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; font-size:12.5px; }

  .card-list{ display:flex; flex-direction:column; gap:10px; }
  .item-card{ background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 2px rgba(16,24,32,0.03); }
  .item-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap: 10px; }
  .item-title{ font-weight:600; font-size:14px; }
  .item-meta{ font-size:12px; color: var(--text-faint); margin-top:4px; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background: rgba(27,31,35,0.45); display:none; align-items:center; justify-content:center;
    z-index: 50; padding: 20px;
  }
  .overlay.visible{ display:flex; }
  .modal{ background: var(--surface); border:1px solid var(--line); border-radius: 12px; width: 460px; max-width:100%; max-height:88vh; overflow-y:auto; padding: 22px; position:relative; box-shadow: 0 20px 48px rgba(16,24,32,0.18); }
  .modal-title{ font-size:16px; font-weight:700; margin-bottom: 16px; padding-inline-end: 28px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 18px; }
  .modal-close-x{
    position:absolute; top:16px; inset-inline-end:16px; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color: var(--text-faint);
    font-size:16px; border:1px solid transparent; line-height:1;
  }
  .modal-close-x:hover{ background: var(--surface-2); color: var(--text); border-color: var(--line); }

  .empty-state{ text-align:center; padding: 50px 20px; color: var(--text-faint); font-size:13.5px; }

  .ai-box{
    border: 1px solid var(--line); border-inline-start: 3px solid var(--gold);
    background: var(--gold-dim); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  }
  .ai-box-label{ font-family: var(--font-en); font-size:11px; color: var(--gold); text-transform:uppercase; font-weight:700; letter-spacing:0.06em; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
  .ai-box-text{ font-size: 14px; line-height:1.6; }
  .spin{ animation: spin 0.8s linear infinite; display:inline-block; }
  @keyframes spin{ to { transform: rotate(360deg); } }

  .toast{
    position: fixed; bottom: 24px; inset-inline-end: 24px; background: var(--surface); border:1px solid var(--line);
    border-inline-start: 3px solid var(--positive); padding: 12px 18px; border-radius: var(--radius); font-size: 13px;
    z-index: 100; opacity:0; transform: translateY(8px); transition: all 0.25s ease; box-shadow: 0 8px 24px rgba(16,24,32,0.12);
  }
  .toast.error{ border-inline-start-color: var(--danger); }
  .toast.visible{ opacity:1; transform: translateY(0); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px;">
      <div>
        <div class="wordmark">CODELA / OS</div>
        <div class="login-title" id="loginTitleText" data-t="loginTitle">تسجيل الدخول</div>
      </div>
      <div class="lang-toggle" id="langToggleLogin">
        <span data-lang="ar">AR</span><span data-lang="en">EN</span>
      </div>
    </div>

    <div id="authTabs" style="display:flex; gap:18px; margin-bottom:20px; border-bottom:1px solid var(--line);">
      <div class="auth-tab active" data-tab="login" data-onclick="switchAuthTab('login')" data-t="tabLogin" style="padding-bottom:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--gold); border-bottom:2px solid var(--gold);">دخول</div>
      <div class="auth-tab" data-tab="register" data-onclick="switchAuthTab('register')" data-t="tabRegister" style="padding-bottom:10px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-faint); border-bottom:2px solid transparent;">إنشاء شركة جديدة</div>
    </div>

    <div id="loginError" class="error-msg hidden"></div>

    <!-- LOGIN FORM -->
    <div id="loginFormBlock">
      <div class="field">
        <label data-t="email">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="you@codela.com">
      </div>
      <div class="field">
        <label data-t="password">كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>
      <div class="field hidden" id="tenantSlugField">
        <label data-t="workspaceSlug">معرّف الشركة (لو عندك أكتر من شركة بنفس الإيميل)</label>
        <input type="text" id="loginTenantSlug" placeholder="codela">
      </div>
      <button class="btn" style="width:100%;" data-onclick="doLogin()" id="loginBtn"><span data-t="loginBtn">دخول</span></button>
      <div class="demo-hint" data-t="demoHint">
        استخدم بيانات الدخول التي يحددها مدير النظام
      </div>
    </div>

    <!-- 2FA CHALLENGE -->
    <div id="twoFaBlock" class="hidden">
      <div class="field">
        <label data-t="twoFaCode">كود التحقق من تطبيق المصادقة</label>
        <input type="text" id="twoFaCodeInput" placeholder="123456" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn" style="width:100%;" data-onclick="submitTwoFaLogin()"><span data-t="verify">تأكيد</span></button>
      <button class="btn secondary" style="width:100%; margin-top:8px;" data-onclick="switchAuthTab('login')"><span data-t="cancel">إلغاء</span></button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerFormBlock" class="hidden">
      <div class="field">
        <label data-t="companyName">اسم الشركة</label>
        <input type="text" id="regCompany" placeholder="My Agency">
      </div>
      <div class="field">
        <label data-t="yourName">اسمك</label>
        <input type="text" id="regName" placeholder="Ahmed Ali">
      </div>
      <div class="field">
        <label data-t="email">البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="you@company.com">
      </div>
      <div class="field">
        <label data-t="password">كلمة المرور</label>
        <input type="password" id="regPassword" placeholder="8+ characters">
      </div>
      <button class="btn" style="width:100%;" data-onclick="doRegister()" id="registerBtn"><span data-t="createWorkspace">إنشاء الشركة</span></button>
    </div>
    <div class="field" style="margin-top:22px; color:var(--text-dim); font-size:12px;">API endpoint: same-origin</div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="appShell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">CODELA / OS</div>
      <div class="subline" data-t="tagline">Operations Command Center</div>
    </div>
    <nav id="navList"></nav>
    <div class="sidebar-footer">
      <div class="lang-toggle" id="langToggleApp" style="margin-bottom:14px;">
        <span data-lang="ar">AR</span><span data-lang="en">EN</span>
      </div>
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">?</div>
        <div>
          <div class="user-name" id="userName">—</div>
          <div class="user-role" id="userRole">—</div>
        </div>
      </div>
      <button class="btn secondary btn-sm" style="width:100%;" data-onclick="logout()"><span data-t="logout">تسجيل الخروج</span></button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">—</div>
      <div class="topbar-right">
        <div class="ai-pill"><span class="ai-dot" id="aiDot"></span><span id="aiStatusText">AI —</span></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js" defer></script>

</body>
</html>
